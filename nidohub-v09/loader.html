<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NidoHub</title>
<style>
html,body{margin:0;min-height:100%;background:#f5f2ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#212726}
#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:28px}
.box{max-width:360px}.logo{width:62px;height:62px;border-radius:20px;background:#55776a;color:#fff;display:grid;place-items:center;margin:0 auto 16px;font-weight:900}
h1{margin:0 0 6px;font-size:24px}p{color:#717674;font-size:13px;line-height:1.45}
</style>
</head>
<body>
<div id="boot"><div class="box"><div class="logo">NH</div><h1>Apro NidoHub…</h1><p>Caricamento della demo.</p></div></div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/SleeveMySeal/stanza1/main/nidohub-v09/';
    const urls=[1,2,3,4].map(n=>base+'part'+n+'.txt');
    const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('Errore caricamento '+r.status);
      return r.text();
    })));
    const b64=parts.join('').trim();
    const binary=atob(b64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    if(!('DecompressionStream' in window)) throw new Error('Safari non supporta decompressione gzip');
    const ds=new DecompressionStream('gzip');
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<div class="box"><div class="logo">NH</div><h1>Impossibile aprire NidoHub</h1><p>'+String(e)+'</p></div>';
  }
})();
</script>
</body>
</html>
