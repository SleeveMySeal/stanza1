<div id="boot" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;background:#f7f3ea;color:#42685c;text-align:center;padding:24px"><div><div style="font-size:52px">🌈</div><h2 style="margin:10px 0 4px">NidoHub</h2><p id="status" style="color:#737975">Caricamento della demo…</p></div></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const base='https://raw.githubusercontent.com/SleeveMySeal/stanza1/main/nidohub-v09/chunks/';
  const parts=[];
  for(let i=0;i<8;i++){
   status.textContent='Caricamento… '+(i+1)+'/8';
   const r=await fetch(base+i+'.txt?'+Date.now(),{cache:'no-store'});
   if(!r.ok) throw new Error('Download '+i+' non riuscito ('+r.status+')');
   parts.push((await r.text()).trim());
  }
  status.textContent='Quasi pronto…';
  const bin=atob(parts.join(''));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  if(!('DecompressionStream' in window)) throw new Error('Questa versione di Safari non supporta la decompressione necessaria.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const app=await new Response(stream).text();
  document.open();
  document.write(app);
  document.close();
 }catch(err){
  console.error(err);
  document.getElementById('boot').innerHTML='<div><div style="font-size:48px">⚠️</div><h2>Non riesco ad aprire NidoHub</h2><p style="color:#737975;line-height:1.5">Ricarica la pagina. Se continua, inviami uno screenshot.</p><pre style="white-space:pre-wrap;text-align:left;background:#fff;padding:10px;border-radius:12px;font-size:11px">'+String(err)+'</pre></div>';
 }
})();
</script>
