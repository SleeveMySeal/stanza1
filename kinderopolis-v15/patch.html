<style id="v15-css">

.v15-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.v15-action{border:1px solid var(--v15-line);background:#fff;border-radius:18px;padding:12px;text-align:left}.v15-action .ic{font-size:22px}.v15-action b{display:block;font-size:11px;margin-top:7px}.v15-action span{display:block;font-size:9px;color:#7b8582;line-height:1.35;margin-top:2px}
.v15-list{display:grid;gap:8px}.v15-row{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center;padding:10px;border:1px solid var(--v15-line);border-radius:16px;background:#fff}.v15-row .ic{width:42px;height:42px;border-radius:13px;background:#eef4f1;display:grid;place-items:center;font-size:20px}.v15-row b{font-size:11px}.v15-row span{display:block;font-size:8.5px;color:#7a8581;line-height:1.35;margin-top:2px}.v15-badge{display:inline-flex!important;width:max-content;padding:5px 7px;border-radius:999px;background:#eaf4ef;color:#4e6a60;font-size:8px!important;font-weight:950}.v15-badge.warn{background:#fff2ca;color:#7b6126}.v15-badge.bad{background:#fde8e5;color:#97554f}
.v15-commfilters{display:flex;gap:6px;overflow:auto;margin:8px 0 10px}.v15-chip{white-space:nowrap;border:1px solid var(--v15-line);background:#fff;border-radius:999px;padding:7px 9px;font-size:8px;font-weight:900;color:#61706b}

.v15-rolegrid{display:grid;gap:8px}.v15-role{display:grid;grid-template-columns:44px 1fr auto;gap:9px;align-items:center;padding:10px;border:1px solid var(--v15-line);border-radius:16px;background:#fff}.v15-role .ic{width:44px;height:44px;border-radius:13px;background:#f0f4f2;display:grid;place-items:center;font-size:20px}.v15-role b{font-size:11px}.v15-role span{display:block;font-size:8.5px;color:#78837f;margin-top:2px;line-height:1.35}.v15-role button{border:0;background:#edf3f0;color:#506b62;border-radius:10px;padding:7px 8px;font-size:8px;font-weight:950}

.v15-sectiongrid{display:grid;gap:8px}.v15-sec{display:grid;grid-template-columns:44px 1fr auto;gap:9px;align-items:center;padding:10px;border:1px solid var(--v15-line);border-radius:16px;background:#fff}.v15-sec .ic{width:44px;height:44px;border-radius:13px;background:#eef4f1;display:grid;place-items:center;font-size:21px}.v15-sec small{display:block;font-size:8px;color:#89928f;font-weight:900}.v15-sec b{font-size:11px}.v15-sec span{display:block;font-size:8.5px;color:#77827f;margin-top:2px}.v15-sec button{border:0;background:#edf3f0;color:#506b62;border-radius:10px;padding:7px 8px;font-size:8px;font-weight:950}

</style>

function v15Kpi(n,l,c=''){return '<div class="v15-kpi '+c+'"><b>'+n+'</b><span>'+l+'</span></div>'}

function v15SaveCommunication(){
  const title=document.getElementById('v15CommTitle').value.trim();if(!title){toast('Inserisci il titolo');return}
  const target=document.getElementById('v15CommTarget').value;
  state.v15.communications.unshift({id:'v15c_'+Date.now(),title,target,urgent:document.getElementById('v15CommUrgent').checked,ack:document.getElementById('v15CommAck').checked,read:'0 destinatari'});
  persist();closeModal('v8Modal');render();toast('Comunicazione demo pubblicata');
}

const v15SetupNavBase=setupNav;
setupNav=function(){
  if(role!=='director')return v15SetupNavBase();
  const items=[['home','☀️','Oggi'],['classes','🏫','Sedi'],['payments','💳','Contabilità'],['messages','📣','Comunic.'],['profile','✏️','Contenuti']];
  const nav=document.getElementById('bottomNav');nav.style.gridTemplateColumns='repeat(5,1fr)';
  nav.innerHTML=items.map(it=>'<button class="nav '+(page===it[0]?'active':'')+'" data-page="'+it[0]+'"><span class="i">'+it[1]+'</span>'+it[2]+'</button>').join('');
  nav.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.page));
};
const v15RenderDirectorBase=renderDirector;
renderDirector=function(){
  if(page==='home')return v15DirectorDashboard();
  if(page==='classes')return v15DirectorClasses();
  if(page==='payments')return v15AccountingPage();
  if(page==='messages')return v15MessagesPage();
  return v15RenderDirectorBase();
};
const v15RenderParentBase=renderParent;
renderParent=function(){const out=v15RenderParentBase();return page==='home'?'<div class="v15-info" style="margin:0 0 10px">🏫 Sede Caltanissetta · Sezione prima infanzia</div>'+out:out};

renderTeacher=function(){const out=v15RenderTeacherBase();return page==='home'?'<div class="v15-info" style="margin:0 0 10px">🏫 Sede Caltanissetta · Sezione Volpini</div>'+out:out};
