<div id="boot" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;background:#eaf7fb;color:#31564e;text-align:center;padding:24px"><div><div style="font-size:50px">🏙️📣</div><h2 style="margin:9px 0 4px">Kinderopolis 1.3 FIX2</h2><p id="status" style="color:#6d7b78">Apro la giornata…</p></div></div><script>(async()=>{const st=document.getElementById('status');try{const fetchText=async u=>{const r=await fetch(u+'?v=13fix2-'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Download non riuscito: '+u);return await r.text()};const gunzip=async(b64,label)=>{const clean=b64.replace(/\s/g,'');if(!clean||clean.length%4!==0)throw Error(label+' incompleto ('+clean.length+' caratteri)');const bin=atob(clean),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);try{return await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}catch(e){throw Error(label+' non valido: '+e.message)}};const base='https://raw.githubusercontent.com/SleeveMySeal/stanza1/main/';let parts=[];for(let i=0;i<8;i++){st.textContent='Caricamento base '+(i+1)+'/8…';parts.push((await fetchText(base+'nidohub-v09/chunks/'+i+'.txt')).trim())}let html=await gunzip(parts.join(''),'Base NidoHub');st.textContent='Caricamento Kinderopolis…';const p1=await fetchText(base+'kinderopolis-v1/patch.html');st.textContent='Interfaccia 1.1…';const p11=await gunzip((await fetchText(base+'kinderopolis-v11/chunks/0.txt'))+(await fetchText(base+'kinderopolis-v11/chunks/1.txt')),'Interfaccia 1.1');st.textContent='Storico giornaliero…';const p12=await gunzip(await fetchText(base+'kinderopolis-v12/chunks/0.txt'),'Storico 1.2');st.textContent='Comunicazioni…';const p13raw=await fetchText(base+'kinderopolis-v13/chunks/0.txt');if(p13raw.replace(/\s/g,'').length!==6632)throw Error('Comunicazioni 1.3 incomplete: '+p13raw.replace(/\s/g,'').length+'/6632');const p13=await gunzip(p13raw,'Comunicazioni 1.3');st.textContent='Pronto ✓';html=html.replace('</body>',p1+p11+p12+p13+'</body>');document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('boot').innerHTML='<div><div style="font-size:46px">⚠️</div><h2>Non riesco ad aprire Kinderopolis</h2><p style="color:#6d7b78">'+String(e)+'</p><p style="font-size:11px;color:#82908c">Invia questa schermata se il problema continua.</p></div>'}})();</script>
