<div id="boot" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;background:#eaf7fb;color:#31564e;text-align:center;padding:24px"><div><div style="font-size:50px">🏙️🐾</div><h2 style="margin:9px 0 4px">Kinderopolis 1.1</h2><p id="status" style="color:#6d7b78">Apro Kinder’s School…</p></div></div><script>(async()=>{const st=document.getElementById('status');try{const b='https://raw.githubusercontent.com/SleeveMySeal/stanza1/main/nidohub-v09/chunks/';let parts=[];for(let i=0;i<8;i++){st.textContent='Caricamento base '+(i+1)+'/8…';let r=await fetch(b+i+'.txt?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Download base '+i+' non riuscito');parts.push((await r.text()).trim())}let bin=atob(parts.join('')),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();st.textContent='Caricamento Kinderopolis…';let p1=await fetch('https://raw.githubusercontent.com/SleeveMySeal/stanza1/main/kinderopolis-v1/patch.html?'+Date.now(),{cache:'no-store'});if(!p1.ok)throw Error('Tema Kinderopolis non disponibile');let patch1=await p1.text();st.textContent='Applico interfaccia 1.1…';let c0=await (await fetch('https://raw.githubusercontent.com/SleeveMySeal/stanza1/main/kinderopolis-v11/chunks/0.txt?'+Date.now(),{cache:'no-store'})).text();let c1=await (await fetch('https://raw.githubusercontent.com/SleeveMySeal/stanza1/main/kinderopolis-v11/chunks/1.txt?'+Date.now(),{cache:'no-store'})).text();let pbin=atob((c0+c1).replace(/\s/g,'')),pbytes=new Uint8Array(pbin.length);for(let i=0;i<pbin.length;i++)pbytes[i]=pbin.charCodeAt(i);let patch11=await new Response(new Blob([pbytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();html=html.replace('</body>',patch1+patch11+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><div style="font-size:46px">⚠️</div><h2>Non riesco ad aprire Kinderopolis</h2><p style="color:#6d7b78">Ricarica la pagina e riprova.</p><pre style="white-space:pre-wrap;text-align:left;background:#fff;padding:10px;border-radius:12px;font-size:11px">'+String(e)+'</pre></div>'}})();</script>
