<style id="v14-css">
:root{--v14-blue:#eaf5fb;--v14-green:#e7f4ec;--v14-yellow:#fff3d2;--v14-peach:#ffeadf;--v14-lilac:#eee9fa;--v14-line:#e1e6e1;--v14-ink:#29443e;--v14-muted:#73807c}
.v14-head{margin:4px 0 14px}.v14-head h2{font-size:25px;line-height:1.08;letter-spacing:-.7px;margin:0;color:var(--v14-ink)}.v14-head p{font-size:11px;color:var(--v14-muted);line-height:1.45;margin:5px 0 0}
.v14-content-grid{display:grid;gap:10px}.v14-content-card{display:grid;grid-template-columns:54px 1fr auto;gap:11px;align-items:center;width:100%;padding:13px;border:1px solid var(--v14-line);border-radius:21px;background:#fff;text-align:left;color:inherit}.v14-content-card .ic{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:26px;background:#f1f4f2}.v14-content-card.program .ic{background:var(--v14-lilac)}.v14-content-card.menu .ic{background:var(--v14-green)}.v14-content-card.activity .ic{background:var(--v14-peach)}.v14-content-card.reminder .ic{background:var(--v14-yellow)}.v14-content-card.comm .ic{background:var(--v14-blue)}.v14-content-card .copy b{display:block;font-size:14px;color:#314a43}.v14-content-card .copy span{display:block;font-size:10px;color:#76827e;line-height:1.35;margin-top:3px}.v14-content-card .side{text-align:right;min-width:66px}.v14-status{display:inline-flex;padding:6px 8px;border-radius:999px;font-size:8px;font-weight:950;background:#eef2f0;color:#6b7874}.v14-status.ok{background:#e2f2e8;color:#436455}.v14-status.warn{background:#fff0c9;color:#765a25}.v14-content-card .arr{display:block;font-size:20px;color:#9aa39f;margin-top:5px}
.v14-published-note{padding:10px 12px;border-radius:15px;background:#eef6fa;color:#526e7b;font-size:10px;line-height:1.45;margin:10px 0 0}.v14-published-note.ok{background:#e9f5ed;color:#48675c}
.v14-list{display:grid;gap:8px}.v14-item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;border:1px solid var(--v14-line);border-radius:17px;padding:10px;background:#fff}.v14-item .ic{width:44px;height:44px;border-radius:14px;background:#f0f5f2;display:grid;place-items:center;font-size:21px}.v14-item b{display:block;font-size:12px}.v14-item span{display:block;font-size:9px;color:#76827e;margin-top:2px;line-height:1.35}.v14-item button{border:0;background:#fff1ef;color:#9a554e;border-radius:10px;padding:7px 8px;font-size:10px;font-weight:900}
.v14-mini-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.v14-mini-actions button{border:0;border-radius:14px;padding:11px;font-size:10px;font-weight:900}.v14-mini-actions .primary{background:#55776a;color:#fff}.v14-mini-actions .soft{background:#edf3f0;color:#4d685f}.v14-mini-actions .danger{background:#fff0ed;color:#96534d}
.v14-reminders{display:grid;gap:8px;margin-top:8px}.v14-reminder{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;padding:11px;border-radius:17px;background:#fff9e8;border:1px solid #eee0b6}.v14-reminder .ic{width:42px;height:42px;border-radius:13px;background:#fff2ca;display:grid;place-items:center;font-size:21px}.v14-reminder b{font-size:12px}.v14-reminder span{display:block;font-size:9px;color:#7b735f;margin-top:2px;line-height:1.35}
.v14-director-cta{display:flex;align-items:center;gap:11px;border:1px solid #d8e5df;background:linear-gradient(135deg,#f5fbf8,#edf6fb);border-radius:21px;padding:13px;margin:12px 0}.v14-director-cta .ic{width:50px;height:50px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:25px}.v14-director-cta .copy{flex:1}.v14-director-cta b{font-size:13px}.v14-director-cta span{display:block;font-size:10px;color:#71807b;margin-top:3px}.v14-director-cta button{border:0;background:#55776a;color:#fff;border-radius:12px;padding:9px 10px;font-size:9px;font-weight:950}
.v14-menu-grid{display:grid;gap:8px}.v14-menu-row{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center}.v14-menu-row label{font-size:10px;font-weight:900;color:#667570}.v14-menu-row input{width:100%}
.v14-no-pdf{padding:10px 12px;border-radius:15px;background:#f3f5f4;color:#687571;font-size:10px;line-height:1.4;margin-top:10px}
</style>
<script id="v14-js">
// Kinderopolis v1.4 — director-driven published content. Parent sees exactly what direction/staff publish.
const V14_MARK='kinderopolis_v14_initialized';
if(!localStorage.getItem(V14_MARK)){
  v11FreshState();
  state.days={}; state.communications=[]; state.plannedActivities=[]; state.parentReminders=[];
  state.dailyPlan={activityReady:false,activityTitle:'',activityDetails:'',menuReady:false};
  state.activities=[]; state.todayMenu=(state.todayMenu||[]).map(x=>({...x,value:''}));
  v12SelectedDate=v12Today(); v12SnapshotToday();
  localStorage.setItem(V14_MARK,'1'); persist();
}
if(!Array.isArray(state.plannedActivities))state.plannedActivities=[];
if(!Array.isArray(state.parentReminders))state.parentReminders=[];
const v14SnapshotBase=v12SnapshotToday;
v12SnapshotToday=function(){v14SnapshotBase();const k=v12Today();if(!state.days[k])return;state.days[k].plannedActivities=JSON.parse(JSON.stringify(state.plannedActivities||[]));state.days[k].parentReminders=JSON.parse(JSON.stringify(state.parentReminders||[]));};
function v14ProgramItems(day){if(day?.plannedActivities?.length)return day.plannedActivities;if(day?.dailyPlan?.activityReady&&day?.dailyPlan?.activityTitle)return [{title:day.dailyPlan.activityTitle,details:day.dailyPlan.activityDetails||'',icon:'🎨'}];return [];}
function v14MenuReady(day){return !!(day?.dailyPlan?.menuReady&&day?.menu?.some(x=>(x.value||'').trim()));}
function v14Programme(day){const s=v12Schedule(day),acts=v14ProgramItems(day),m=v14MenuReady(day);return `<div class="v12-sectiontitle">Programma della giornata</div><div class="v12-sectionsub">Orari previsti, attività pubblicate e cosa mangeranno.</div><div class="v12-timegrid"><div class="v12-time"><div class="ic">👋</div><div><small>INGRESSO PREVISTO</small><b>${esc(s.entryStart||'—')} – ${esc(s.entryEnd||'—')}</b></div></div><div class="v12-time exit"><div class="ic">🏡</div><div><small>USCITA PREVISTA</small><b>${esc(s.exitStart||'—')} – ${esc(s.exitEnd||'—')}</b></div></div></div><div class="v12-program" style="margin-top:9px"><div class="v12-card"><div class="v12-cardhead"><div class="v12-cardicon">🎨</div><div class="copy"><small>COSA FARANNO</small>${acts.length?`<b>${acts.length===1?esc(acts[0].title):acts.length+' attività previste'}</b>`:`<div class="v12-emptyline">○ Non elaborato</div>`}</div></div>${acts.length?`<div class="v14-list" style="margin-top:10px">${acts.map(a=>`<div class="v14-item"><div class="ic">${esc(a.icon||'🎨')}</div><div><b>${esc(a.title)}</b><span>${esc(a.details||'')}</span></div></div>`).join('')}</div>`:''}</div><div class="v12-card menu"><div class="v12-cardhead"><div class="v12-cardicon">🍽️</div><div class="copy"><small>COSA MANGERANNO</small>${m?`<b>Menu pubblicato dalla scuola</b>`:`<div class="v12-emptyline">○ Non elaborato</div>`}</div></div>${m?`<div class="v12-menulist">${day.menu.filter(x=>(x.value||'').trim()).map(x=>`<div class="v12-menuitem"><b>${esc(x.label)}</b><span>${esc(x.value)}</span></div>`).join('')}</div>`:''}</div></div>`;}
v12Programme=v14Programme;
function v14RemindersBlock(day){const rs=day?.parentReminders||[];if(!rs.length)return '';return `<div class="v12-sectiontitle">Promemoria</div><div class="v12-sectionsub">Indicazioni pubblicate dalla scuola per questa giornata.</div><div class="v14-reminders">${rs.map(r=>`<div class="v14-reminder"><div class="ic">${esc(r.icon||'🎒')}</div><div><b>${esc(r.title)}</b><span>${esc(r.text||'')}</span></div></div>`).join('')}</div>`;}
v12ParentHome=function(){const day=v12Day();return `${v11Banner('parent')}${v12DateNav()}${v12ModeTag()}${day?v14Programme(day)+v14RemindersBlock(day)+v12ActualParent(day):v12NoHistory()}${v12IsToday()?v11HealthReadOnly():''}`;};
function v14ContentStatus(){return {program:state.plannedActivities.length,menu:!!(state.dailyPlan?.menuReady&&(state.todayMenu||[]).some(x=>(x.value||'').trim())),activities:(state.activities||[]).length,reminders:(state.parentReminders||[]).length,communications:(state.communications||[]).length};}
function v14Status(n,labelEmpty='Non elaborato'){return n?`<span class="v14-status ok">Pubblicato</span>`:`<span class="v14-status">${labelEmpty}</span>`;}
function v14DirectorContent(){const s=v14ContentStatus();return `${v11Banner('director')}<div class="v14-head"><h2>Contenuti</h2><p>Qui prepari ciò che le famiglie vedranno. Ogni contenuto ha un solo punto di gestione.</p></div><div class="v14-content-grid"><button class="v14-content-card program" onclick="v14OpenProgram()"><div class="ic">🎨</div><div class="copy"><b>Programma di oggi</b><span>${s.program?s.program+' attività pubblicate':'Cosa faranno oggi'}</span></div><div class="side">${v14Status(s.program)}<span class="arr">›</span></div></button><button class="v14-content-card menu" onclick="v14OpenMenu()"><div class="ic">🍽️</div><div class="copy"><b>Menu di oggi</b><span>${s.menu?'Visibile alle famiglie':'Compila cosa mangeranno'}</span></div><div class="side">${v14Status(s.menu)}<span class="arr">›</span></div></button><button class="v14-content-card activity" onclick="v14OpenActivities()"><div class="ic">✨</div><div class="copy"><b>Attività svolte</b><span>${s.activities?s.activities+' registrate oggi':'Aggiornamenti reali della giornata'}</span></div><div class="side">${s.activities?`<span class="v14-status ok">${s.activities}</span>`:`<span class="v14-status">Vuoto</span>`}<span class="arr">›</span></div></button><button class="v14-content-card reminder" onclick="v14OpenReminders()"><div class="ic">🎒</div><div class="copy"><b>Promemoria</b><span>${s.reminders?s.reminders+' visibili alle famiglie':'Materiale, avvisi pratici, scadenze'}</span></div><div class="side">${s.reminders?`<span class="v14-status ok">${s.reminders}</span>`:`<span class="v14-status">Vuoto</span>`}<span class="arr">›</span></div></button><button class="v14-content-card comm" onclick="go('messages')"><div class="ic">📣</div><div class="copy"><b>Comunicazioni</b><span>${s.communications?s.communications+' pubblicate':'Avvisi ufficiali con presa visione'}</span></div><div class="side">${s.communications?`<span class="v14-status ok">${s.communications}</span>`:`<span class="v14-status">Vuoto</span>`}<span class="arr">›</span></div></button></div><div class="v14-published-note ok">✓ Il genitore vede solo i contenuti pubblicati.</div><button class="btn ghost full" style="margin-top:18px" onclick="logout()">Esci</button>`;}
function v14OpenProgram(){const acts=state.plannedActivities||[];document.getElementById('v8ModalContent').innerHTML=`${stepHeader(1,1,'Programma di oggi','Aggiungi le attività previste. Saranno visibili nella home delle famiglie.')}<div class="v14-list">${acts.length?acts.map((a,i)=>`<div class="v14-item"><div class="ic">${esc(a.icon||'🎨')}</div><div><b>${esc(a.title)}</b><span>${esc(a.details||'')}</span></div><button onclick="v14RemoveProgram(${i})">Elimina</button></div>`).join(''):'<div class="v13-empty"><div class="e">🎨</div><b>Nessuna attività prevista</b><p>Aggiungi la prima attività del programma.</p></div>'}</div><hr class="sep"><div class="field"><div class="label">Titolo attività</div><input id="v14ProgramTitle" class="input"></div><div class="field"><div class="label">Descrizione</div><textarea id="v14ProgramDetails" class="textarea"></textarea></div><div class="field"><div class="label">Icona</div><select id="v14ProgramIcon" class="select"><option>🎨</option><option>📚</option><option>🎵</option><option>🏃</option><option>🧩</option><option>🌿</option></select></div><button class="btn primary full" onclick="v14AddProgram()">＋ Pubblica attività</button>`;openModal('v8Modal');}
function v14AddProgram(){const t=v14ProgramTitle.value.trim(),d=v14ProgramDetails.value.trim();if(!t){toast('Inserisci il titolo');return}state.plannedActivities.push({id:'plan_'+Date.now(),title:t,details:d,icon:v14ProgramIcon.value});state.dailyPlan.activityReady=true;state.dailyPlan.activityTitle=state.plannedActivities[0].title;state.dailyPlan.activityDetails=state.plannedActivities[0].details||'';persist();v14OpenProgram();render();toast('Attività pubblicata alle famiglie');}
function v14RemoveProgram(i){state.plannedActivities.splice(i,1);state.dailyPlan.activityReady=state.plannedActivities.length>0;state.dailyPlan.activityTitle=state.plannedActivities[0]?.title||'';state.dailyPlan.activityDetails=state.plannedActivities[0]?.details||'';persist();v14OpenProgram();render();}
function v14OpenMenu(){const map={};(state.todayMenu||[]).forEach(x=>map[x.label]=x.value||'');const labels=['Primo','Secondo','Contorno','Pane','Frutta'];document.getElementById('v8ModalContent').innerHTML=`${stepHeader(1,1,'Menu di oggi','Compila solo le voci previste. Quelle vuote non verranno mostrate.')}<div class="v14-menu-grid">${labels.map(l=>`<div class="v14-menu-row"><label>${l}</label><input id="v14Menu_${l}" class="input" value="${esc(map[l]||'')}" placeholder="Non elaborato"></div>`).join('')}</div><button class="btn primary full" style="margin-top:14px" onclick="v14PublishMenu()">🍽️ Pubblica menu</button>`;openModal('v8Modal');}
function v14PublishMenu(){const icons={Primo:'🍝',Secondo:'🥩',Contorno:'🥕',Pane:'🍞',Frutta:'🍎'};const vals=['Primo','Secondo','Contorno','Pane','Frutta'].map(label=>({id:label.toLowerCase(),icon:icons[label],label,value:document.getElementById('v14Menu_'+label).value.trim()}));if(!vals.some(x=>x.value)){toast('Inserisci almeno una voce del menu');return}state.todayMenu=vals;state.dailyPlan.menuReady=true;persist();closeModal('v8Modal');render();showV9Success('Menu pubblicato','Le famiglie lo vedono ora in “Cosa mangeranno”.');}
function v14OpenActivities(){const as=state.activities||[];document.getElementById('v8ModalContent').innerHTML=`${stepHeader(1,1,'Attività svolte','Registra ciò che è realmente avvenuto. Comparirà in “Com’è andata”.')}<div class="v14-list">${as.length?as.slice().reverse().map(a=>`<div class="v14-item"><div class="ic">${a.type==='Lettura'?'📚':'✨'}</div><div><b>${esc(a.title||a.type||'Attività')}</b><span>${esc(a.time||'')} ${a.details?'· '+esc(a.details):''}</span></div><button onclick="v14DeleteActivity('${escAttr(a.id)}')">Elimina</button></div>`).join(''):'<div class="v13-empty"><div class="e">✨</div><b>Nessuna attività registrata</b></div>'}</div><hr class="sep"><div class="field"><div class="label">Tipo</div><select id="v14ActivityType" class="select"><option>Laboratorio</option><option>Lettura</option><option>Musica</option><option>Motricità</option><option>Gioco</option><option>Uscita</option></select></div><div class="field"><div class="label">Titolo</div><input id="v14ActivityTitle" class="input"></div><div class="field"><div class="label">Descrizione</div><textarea id="v14ActivityDetails" class="textarea"></textarea></div><button class="btn primary full" onclick="v14AddActivity()">＋ Registra attività</button>`;openModal('v8Modal');}
function v14AddActivity(){const title=v14ActivityTitle.value.trim();if(!title){toast('Inserisci il titolo');return}const now=new Date();state.activities.push({id:'a_'+Date.now(),type:v14ActivityType.value,title,details:v14ActivityDetails.value.trim(),time:now.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}),when:'Oggi',audience:'Tutta la sezione'});persist();v14OpenActivities();render();toast('Attività visibile alla famiglia');}
function v14DeleteActivity(id){state.activities=state.activities.filter(a=>String(a.id)!==String(id));persist();v14OpenActivities();render();}
function v14OpenReminders(){const rs=state.parentReminders||[];document.getElementById('v8ModalContent').innerHTML=`${stepHeader(1,1,'Promemoria','Indicazioni pratiche che compariranno nella giornata della famiglia.')}<div class="v14-list">${rs.length?rs.map(r=>`<div class="v14-item"><div class="ic">${esc(r.icon||'🎒')}</div><div><b>${esc(r.title)}</b><span>${esc(r.text||'')}</span></div><button onclick="v14DeleteReminder('${escAttr(r.id)}')">Elimina</button></div>`).join(''):'<div class="v13-empty"><div class="e">🎒</div><b>Nessun promemoria</b></div>'}</div><hr class="sep"><div class="field"><div class="label">Titolo</div><input id="v14ReminderTitle" class="input"></div><div class="field"><div class="label">Dettaglio</div><textarea id="v14ReminderText" class="textarea"></textarea></div><div class="field"><div class="label">Icona</div><select id="v14ReminderIcon" class="select"><option>🎒</option><option>📄</option><option>🧴</option><option>👕</option><option>⏰</option><option>📌</option></select></div><button class="btn primary full" onclick="v14AddReminder()">＋ Pubblica promemoria</button>`;openModal('v8Modal');}
function v14AddReminder(){const t=v14ReminderTitle.value.trim();if(!t){toast('Inserisci il titolo');return}state.parentReminders.push({id:'rem_'+Date.now(),title:t,text:v14ReminderText.value.trim(),icon:v14ReminderIcon.value});persist();v14OpenReminders();render();toast('Promemoria pubblicato');}
function v14DeleteReminder(id){state.parentReminders=state.parentReminders.filter(r=>r.id!==id);persist();v14OpenReminders();render();}
v13ParentProfile=function(){return `${v11Banner('parent')}<div class="v11-section-label">Scheda di Emma</div><div class="v11-category-list">${v11HealthTile()}<button class="v11-category" onclick="v11OpenConsents()"><div class="v11-icon" style="background:#eee8fa">✍️</div><div class="v11-copy"><b>Autorizzazioni</b><span>${pendingConsents()?pendingConsents()+' da firmare':'Tutto completato'}</span></div><div class="v11-arrow">›</div></button><button class="v11-category" onclick="openModal('requestModal')"><div class="v11-icon" style="background:#e8f4ef">✉️</div><div class="v11-copy"><b>Richieste alla scuola</b><span>Scrivi una richiesta personale</span></div><div class="v11-arrow">›</div></button><button class="v11-category" onclick="toast('Documenti scuola')"><div class="v11-icon" style="background:#fff0d4">📁</div><div class="v11-copy"><b>Documenti scuola</b><span>Regolamento, moduli e documenti condivisi</span></div><div class="v11-arrow">›</div></button></div><div class="v14-no-pdf">Lo storico giornaliero si consulta direttamente da Oggi scegliendo la data.</div><button class="btn alt full" style="margin-top:20px" onclick="logout()">Esci</button>`;};
v12DirectorHome=function(){const day=v12Day(),s=v14ContentStatus(),missing=[!s.program?'programma':null,!s.menu?'menu':null].filter(Boolean);return `${v11Banner('director')}${v12DateNav()}${v12ModeTag()}${day?v12DirectorDay(day):v12NoHistory()}${v12IsToday()?`<div class="v14-director-cta"><div class="ic">✏️</div><div class="copy"><b>${missing.length?'Completa i contenuti di oggi':'Contenuti di oggi pubblicati'}</b><span>${missing.length?'Mancano: '+missing.join(' e '):'Programma e menu sono visibili alle famiglie.'}</span></div><button onclick="go('profile')">Apri</button></div>`:''}`;};
setupNav=function(){let items;if(role==='parent')items=[['home','☀️','Oggi'],['messages','📣','Comunicazioni'],['payments','💳','Pagamenti'],['profile','👧','Profilo']];else if(role==='teacher')items=[['home','☀️','Oggi'],['kids','👧','Bambini'],['messages','📣','Comunicazioni'],['profile','⚙️','Altro']];else items=[['home','☀️','Oggi'],['classes','🏫','Sezioni'],['payments','💳','Pagamenti'],['messages','📣','Comunic.'],['profile','✏️','Contenuti']];const nav=document.getElementById('bottomNav');nav.style.gridTemplateColumns=`repeat(${items.length},1fr)`;nav.innerHTML=items.map(it=>`<button class="nav ${page===it[0]?'active':''}" data-page="${it[0]}"><span class="i">${it[1]}</span>${it[2]}${it[0]==='messages'&&v13Unread()?`<span class="badge-dot">${v13Unread()}</span>`:''}</button>`).join('');nav.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.page));};
const v14RenderDirectorBase=renderDirector;renderDirector=function(){if(page==='profile')return v14DirectorContent();if(page==='home')return v12DirectorHome();return v14RenderDirectorBase();};
const v14RenderParentBase=renderParent;renderParent=function(){if(page==='home')return v12ParentHome();if(page==='profile')return v13ParentProfile();return v14RenderParentBase();};
document.title='Kinderopolis 1.4 · Kinder’s School';setupHeader();setupNav();render();
</script>
