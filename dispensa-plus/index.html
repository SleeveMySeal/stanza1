<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eff5ed"><title>Dispensa+</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#f6f6f1;color:#1d2a20;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.dot{width:10px;height:10px;border-radius:50%;background:#1f6b46;display:inline-block;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25;transform:scale(.7)}}</style></head><body><div id="boot"><div style="font-size:52px">🛒</div><h2 style="margin:10px 0 5px">Dispensa+</h2><p id="status" style="color:#6f786d">Preparo la tua dispensa…</p><span class="dot"></span></div><script>(async()=>{const s=document.getElementById('status');try{let parts=[];for(let i=0;i<3;i++){s.textContent='Caricamento '+(i+1)+'/3…';let r=await fetch('./chunks/'+i+'.txt?v=1',{cache:'no-store'});if(!r.ok)throw Error('chunk '+i);parts.push((await r.text()).trim())}const b64=parts.join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div style="font-size:42px">⚠️</div><h2>Non riesco ad aprire Dispensa+</h2><p style="color:#6f786d">Ricarica la pagina. '+String(e)+'</p>'}})();</script></body></html>
