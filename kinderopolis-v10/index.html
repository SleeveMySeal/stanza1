<div id="boot" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;background:#eef9ff;color:#315d7d;text-align:center;padding:24px"><div><div style="font-size:48px">🏙️🐾</div><h2 style="margin:8px 0">Apro Kinderopolis…</h2><p id="prog" style="color:#6d7b80">Caricamento versione 1.0</p></div></div><script>(async()=>{try{const D=async s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()};let a='';for(let i=0;i<8;i++){prog.textContent='Caricamento '+(i+1)+'/10';a+=await(await fetch('https://raw.githubusercontent.com/SleeveMySeal/stanza1/main/nidohub-v09/chunks/'+i+'.txt')).text()}let p='';for(let i=0;i<2;i++){prog.textContent='Caricamento '+(9+i)+'/10';p+=await(await fetch('https://raw.githubusercontent.com/SleeveMySeal/stanza1/main/kinderopolis-v10/patch/'+i+'.txt')).text()}let h=await D(a);h=h.replace('/^\\d{4}\\/\\d{2}$/','/^\d{4}\/\d{2}$/');h=h.replace('</body>',(await D(p))+'</body>');document.open();document.write(h);document.close()}catch(e){boot.innerHTML='<h3>⚠️ Errore di caricamento</h3><p>'+e+'</p>'}})()</script>
