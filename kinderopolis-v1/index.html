<div id="boot" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;background:#eaf7fb;color:#31564e;text-align:center;padding:24px"><div><div style="font-size:50px">🏙️🐾</div><h2 style="margin:9px 0 4px">Kinderopolis</h2><p id="status" style="color:#6d7b78">Apro Kinder’s School…</p></div></div><script>(async()=>{const st=document.getElementById('status');try{const b='https://raw.githubusercontent.com/SleeveMySeal/stanza1/main/nidohub-v09/chunks/';let parts=[];for(let i=0;i<8;i++){st.textContent='Caricamento '+(i+1)+'/8…';let r=await fetch(b+i+'.txt?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Download '+i+' non riuscito');parts.push((await r.text()).trim())}st.textContent='Preparo Kinderopolis…';let bin=atob(parts.join('')),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();let pr=await fetch('https://raw.githubusercontent.com/SleeveMySeal/stanza1/main/kinderopolis-v1/patch.html?'+Date.now(),{cache:'no-store'});if(!pr.ok)throw Error('Patch v1.0 non disponibile');let patch=await pr.text();html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><div style="font-size:46px">⚠️</div><h2>Non riesco ad aprire Kinderopolis</h2><p>'+String(e)+'</p></div>'}})();</script>
