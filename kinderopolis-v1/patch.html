<style>
:root{--ko-sky:#dff2fb;--ko-mint:#dff3e6;--ko-sun:#fff0b8;--ko-peach:#ffe2d4;--ko-lilac:#ece6fa;--ko-ink:#29433e}
body,.app{background:linear-gradient(180deg,#eaf7fb 0,#f7f3ea 230px,#f7f3ea 100%)}.topbar{background:rgba(239,248,249,.95)}
.brand .logo{background:linear-gradient(145deg,#ffb466,#ff8e72)}.brand h1{color:#31544d}
.ko-banner{position:relative;overflow:hidden;padding:17px;border-radius:26px;background:linear-gradient(135deg,var(--ko-sky),#eef8f2 58%,var(--ko-sun));border:1px solid #d6e6e1;margin-bottom:13px}.ko-banner:after{content:'🏢  🏫  🌳  🏘️';position:absolute;right:8px;bottom:-9px;font-size:37px;opacity:.12;white-space:nowrap}.ko-banner small{font-size:10px;font-weight:950;letter-spacing:.08em;color:#648078}.ko-banner h2{position:relative;z-index:1;margin:4px 0;font-size:25px;color:#2d514a}.ko-banner p{position:relative;z-index:1;margin:0;font-size:12px;color:#667b76}.ko-pill{position:relative;z-index:1;display:inline-flex;margin-top:10px;padding:7px 10px;border-radius:999px;background:#fff;font-size:10px;font-weight:900;color:#4c6c64}
.ko-title{font-size:12px;font-weight:950;letter-spacing:.06em;color:#687873;text-transform:uppercase;margin:18px 2px 8px}.ko-sections{display:grid;gap:9px}.ko-sec{display:grid;grid-template-columns:56px 1fr auto;gap:11px;align-items:center;padding:13px;border-radius:21px;background:#fff;border:1px solid #e3e0d9}.ko-animal{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:29px;background:var(--bg,#eef7f4)}.ko-sec small{display:block;font-size:9px;font-weight:950;letter-spacing:.07em;color:#858d8a}.ko-sec b{font-size:15px;color:#30443f}.ko-sec p{margin:3px 0 0;font-size:10px;color:#77817e}.ko-actions{display:flex;gap:5px}.ko-actions button{width:36px;height:36px;border:1px solid #e2dfd7;background:#fff;border-radius:12px}.ko-actions .del{color:#995454;background:#fff4f4}.ko-note{padding:11px 12px;border-radius:16px;background:#fff5d6;border:1px solid #eedfae;color:#6c582e;font-size:11px;line-height:1.4;margin:12px 0}.ko-prio{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;background:#fff;border:1px solid #e4e0d9;margin-bottom:8px}.ko-prio .ic{width:40px;height:40px;border-radius:13px;background:#eef6f3;display:grid;place-items:center}.ko-prio .cp{flex:1}.ko-prio b{font-size:12px}.ko-prio p{font-size:10px;color:#78817f;margin:2px 0 0}.ko-go{border:0;background:#e9f4ef;color:#496960;border-radius:11px;padding:8px 9px;font-size:10px;font-weight:900}
</style>
<script>
const KO_KEY='kinderopolis_v10';
const KO_SECTIONS=[
{id:'topini-lattanti',stage:'Nido Lattanti',name:'Topini',icon:'🐭',kids:8,color:'#e2f4fb',teachers:''},
{id:'topini-primavera',stage:'Nido Primavera',name:'Topini',icon:'🐭',kids:12,color:'#e3f5e9',teachers:''},
{id:'volpini',stage:'Sez. 3 anni',name:'Volpini',icon:'🦊',kids:14,color:'#ffe7d4',teachers:'Sara, Elena'},
{id:'serpentini',stage:'Sez. 4 anni',name:'Serpentini',icon:'🐍',kids:15,color:'#e8f3dc',teachers:''},
{id:'coniglietti-poliziotti',stage:'Sez. 5 anni',name:'Coniglietti poliziotti',icon:'🐰🚓',kids:15,color:'#ece7fa',teachers:''}
];
function koClone(){return JSON.parse(JSON.stringify(KO_SECTIONS))}
function koInit(force=false){if(!state.school)state.school={};state.school.name='Kinder’s School';state.school.themeName='Kinderopolis';state.school.year=state.school.year||'2026/27';state.school.years=state.school.years||['2025/26','2026/27','2027/28'];if(!state.school.years.includes('2026/27'))state.school.years.push('2026/27');if(!state.school.schedule)state.school.schedule={entryStart:'07:30',entryEnd:'09:30',exitStart:'12:00',exitEnd:'14:00'};state.school.byYear=state.school.byYear||{};if(force||!state.school.byYear['2026/27']?.sections?.length)state.school.byYear['2026/27']={sections:koClone()};state.school.sections=state.school.byYear[state.school.year]?.sections||[];(state.kids||[]).forEach(k=>k.section='Volpini')}
try{const s=localStorage.getItem(KO_KEY);if(s){state=JSON.parse(s);koInit(false)}else koInit(true)}catch(e){koInit(true)}
persist=function(){try{localStorage.setItem(KO_KEY,JSON.stringify(state))}catch(e){}};persist();
(function(){const l=document.querySelector('.brand .logo'),h=document.querySelector('.brand h1'),p=document.querySelector('.brand p');if(l)l.textContent='KS';if(h)h.textContent='Kinderopolis';if(p)p.textContent='Kinder’s School · la città dei piccoli cittadini';document.title='Kinderopolis 1.0 · Kinder’s School'})();
function koSecs(){return v9EnsureYear(state.school.year).sections}
function koLegacy(s){return String(s||'').replaceAll('Sezione Girasoli','Sezione Volpini').replaceAll('Girasoli','Volpini').replaceAll('NidoHub','Kinderopolis')}
function koBanner(who){const meta=who==='parent'?'🦊 Emma · Volpini · 3 anni':who==='teacher'?'🦊 Sez. 3 anni · Volpini':'📚 Anno educativo '+esc(state.school.year);return `<div class="ko-banner"><small>KINDER’S SCHOOL · KINDEROPOLIS</small><h2>${who==='parent'?'Benvenuti a Kinderopolis 🏙️':who==='teacher'?'Buongiorno, maestra 👋':'Direzione Kinderopolis 🏙️'}</h2><p>${who==='director'?'Gestisci i quartieri della scuola e ciò che vedono le famiglie.':'La nostra città educativa a tema animali.'}</p><div class="ko-pill">${meta}</div></div>`}
setupHeader=function(){const a=role==='parent'?['EB','Emma Bianchi','🦊 Volpini · Kinderopolis']:role==='teacher'?['SE','Sara Esposito','🦊 Maestra · Volpini']:['KS','Kinder’s School','🏙️ Direzione · Kinderopolis'];avatar.textContent=a[0];profileName.textContent=a[1];profileSub.textContent=a[2];const f=document.getElementById('fab');if(f)f.onclick=role==='parent'?()=>openModal('requestModal'):()=>openModal('communicationModal')}
const koParent=renderParent;renderParent=function(){let o=koLegacy(koParent());if(page==='home')o=koBanner('parent')+o.replace('🌻 Volpini · anno','🦊 Volpini · Sez. 3 anni · anno');return o};
const koTeacher=renderTeacher;renderTeacher=function(){let o=koLegacy(koTeacher());return page==='home'?koBanner('teacher')+o:o};
function koCard(s,i){return `<div class="ko-sec" style="--bg:${s.color||sectionPastel(i)}"><div class="ko-animal">${esc(s.icon||'🐾')}</div><div><small>${esc(s.stage||'SEZIONE')}</small><b>${esc(s.name)}</b><p>${s.kids||0} bambini${s.teachers?' · '+esc(s.teachers):''}</p></div><div class="ko-actions"><button onclick="editSection('${escAttr(s.id)}')">✎</button><button class="del" onclick="removeSection('${escAttr(s.id)}')">🗑</button></div></div>`}
function koYear(){return `<div class="v9-year-card"><div class="v9-year-head"><div><b>📚 Anno educativo</b><p>Ogni anno conserva le proprie sezioni.</p></div><div class="v9-year-actions"><select class="v9-year-select" onchange="setSchoolYear(this.value)">${state.school.years.map(y=>`<option ${y===state.school.year?'selected':''}>${esc(y)}</option>`).join('')}</select><button class="v9-year-manage" onclick="openYearManager()">Gestisci</button></div></div></div>`}
v8YearSelector=koYear;setSchoolYear=function(y){state.school.year=y;v9EnsureYear(y);state.school.sections=koSecs();persist();render();toast('Anno educativo: '+y)};
v7DirectorClasses=function(){const s=koSecs();return `${koBanner('director')}${koYear()}<div class="ko-title">Le sezioni di Kinderopolis · ${s.length}</div>${s.length?`<div class="ko-sections">${s.map(koCard).join('')}</div>`:`<div class="v9-empty-state"><div class="emoji">🏫</div><b>Nessuna sezione</b><p>Crea la prima sezione per ${esc(state.school.year)}.</p></div>`}<button class="v8-add-btn" onclick="openAddSection()">＋ Aggiungi una sezione</button><div class="ko-note"><b>🏙️ Tema dell’anno: Kinderopolis.</b><br>Nido Lattanti: Topini · Nido Primavera: Topini · 3 anni: Volpini · 4 anni: Serpentini · 5 anni: Coniglietti poliziotti.</div>${v6Section('Orari della scuola')}<div class="v6-list">${v6Row('👋','Ingresso',`dalle ${esc(state.school.schedule.entryStart)} alle ${esc(state.school.schedule.entryEnd)}`,'',"openSchoolHours()")}${v6Row('🏡','Uscita',`dalle ${esc(state.school.schedule.exitStart)} alle ${esc(state.school.schedule.exitEnd)}`,'',"openSchoolHours()")}</div>${v6CloseSection()}${v6Section('Anteprima famiglie')}<button class="btn blue full" onclick="openFamilyPreview()">👀 Guarda cosa vedono i genitori</button>${v6CloseSection()}`};
const koDir=renderDirector;renderDirector=function(){if(page==='classes')return v7DirectorClasses();if(page!=='home')return koLegacy(koDir());const s=koSecs(),n=v9PendingFamilyNotices().length,p=state.paymentStatus==='wait'?6:5;return `${koBanner('director')}${koYear()}<div class="ko-title">Da gestire oggi</div><div class="ko-prio"><div class="ic">💳</div><div class="cp"><b>${p} pagamenti da verificare</b><p>Segnalazioni delle famiglie.</p></div><button class="ko-go" onclick="go('payments')">Apri</button></div><div class="ko-prio"><div class="ic">✉️</div><div class="cp"><b>${state.requests.length} richieste aperte</b><p>Messaggi da prendere in carico.</p></div><button class="ko-go" onclick="go('messages')">Apri</button></div>${n?`<div class="ko-prio"><div class="ic">👨‍👩‍👧</div><div class="cp"><b>${n} comunicazioni dalle famiglie</b><p>Assenze o ritiri diversi.</p></div><button class="ko-go" onclick="go('messages')">Apri</button></div>`:''}<div class="ko-title">I quartieri di Kinderopolis</div><div class="ko-sections">${s.map(koCard).join('')}</div><button class="btn primary full" style="margin-top:13px" onclick="go('classes')">🏙️ Gestisci sezioni e anni</button>`};
openAddSection=function(){document.getElementById('v8ModalContent').innerHTML=`${stepHeader(1,1,'Aggiungi una sezione','Crea un nuovo quartiere di Kinderopolis.')}<div class="field"><div class="label">Fascia / tipo</div><input id="koStage" class="input" placeholder="Es. Nido Lattanti"></div><div class="field"><div class="label">Nome sezione</div><input id="v8SectionName" class="input" placeholder="Es. Topini"></div><div class="field"><div class="label">Icona</div><div class="selector-strip">${['🐭','🦊','🐍','🐰','🦁','🐼'].map(x=>`<button class="selector-btn" onclick="selectSectionIcon('${x}',this)">${x}</button>`).join('')}</div><input id="v8SectionIcon" type="hidden" value="🐭"></div><div class="field"><div class="label">Educatrici / insegnanti</div><input id="v8SectionTeachers" class="input"></div><button class="btn primary full" onclick="saveNewSection()">✓ Crea sezione</button>`;openModal('v8Modal')};
saveNewSection=function(){const stage=koStage.value.trim(),name=v8SectionName.value.trim();if(!stage||!name){toast('Inserisci fascia e nome');return}koSecs().push({id:'sec_'+Date.now(),stage,name,icon:v8SectionIcon.value||'🐾',teachers:v8SectionTeachers.value.trim(),kids:0,color:'#eef7f4'});state.school.sections=koSecs();persist();closeModal('v8Modal');render();showV9Success('Sezione creata',stage+' · '+name+' è stata aggiunta.')};
editSection=function(id){const s=koSecs().find(x=>x.id===id);if(!s)return;document.getElementById('v8ModalContent').innerHTML=`${stepHeader(1,1,'Modifica '+s.name,'Aggiorna la sezione.')}<div class="field"><div class="label">Fascia / tipo</div><input id="koEditStage" class="input" value="${esc(s.stage||'')}"></div><div class="field"><div class="label">Nome</div><input id="v8EditName" class="input" value="${esc(s.name)}"></div><div class="field"><div class="label">Educatrici / insegnanti</div><input id="v8EditTeachers" class="input" value="${esc(s.teachers||'')}"></div><button class="btn primary full" onclick="saveSectionEdit('${escAttr(id)}')">✓ Salva</button>`;openModal('v8Modal')};
saveSectionEdit=function(id){const s=koSecs().find(x=>x.id===id),stage=koEditStage.value.trim(),name=v8EditName.value.trim();if(!s||!stage||!name){toast('Fascia e nome sono obbligatori');return}s.stage=stage;s.name=name;s.teachers=v8EditTeachers.value.trim();persist();closeModal('v8Modal');render();toast('Sezione aggiornata')};
removeSection=function(id){const s=koSecs().find(x=>x.id===id);if(!s)return;if((s.kids||0)>0){toast('Prima sposta i bambini: la sezione non è vuota');return}v9EnsureYear(state.school.year).sections=koSecs().filter(x=>x.id!==id);persist();render();toast('Sezione rimossa')};
openYearManager=function(){document.getElementById('v8ModalContent').innerHTML=`${stepHeader(1,1,'Gestisci anni educativi','Ogni anno conserva le proprie sezioni.')}<div>${state.school.years.map(y=>`<div class="v9-year-row"><div class="ycopy"><b>${esc(y)} ${y===state.school.year?'· attivo':''}</b><small>${v9EnsureYear(y).sections.length} sezioni</small></div>${y!==state.school.year?`<button onclick="removeSchoolYear('${escAttr(y)}')">Elimina</button>`:''}</div>`).join('')}</div><div class="field"><div class="label">Nuovo anno</div><input id="v9NewYear" class="input" placeholder="Es. 2028/29"></div><button class="btn primary full" onclick="addSchoolYear()">＋ Aggiungi anno</button>`;openModal('v8Modal')};
addSchoolYear=function(){const y=v9NewYear.value.trim(),a=y.split('/');if(a.length!==2||a[0].length!==4||a[1].length!==2||isNaN(Number(a[0]))||isNaN(Number(a[1]))){toast('Usa il formato 2028/29');return}if(state.school.years.includes(y)){toast('Questo anno esiste già');return}state.school.years.push(y);state.school.years.sort();state.school.byYear[y]={sections:[]};persist();openYearManager();toast('Anno '+y+' aggiunto')};
const koOpen=openModal;openModal=function(id){if(id==='communicationModal'){const s=document.getElementById('commTo');if(s)s.innerHTML='<option>Tutte le famiglie</option>'+koSecs().map(x=>`<option>${esc(x.stage)} · ${esc(x.name)}</option>`).join('')}koOpen(id)};
resetDemo=function(){localStorage.removeItem(KO_KEY);location.reload()};setupHeader();
</script>
